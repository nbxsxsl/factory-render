<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#7C5CFF" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="报工系统" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icon.svg" />
<title>加工厂领料报工系统</title>
<style>
:root{
  --bg:#F5F6FA; --card:#FFFFFF; --text-1:#1B1D29; --text-2:#4A4F63; --text-3:#8A90A6;
  --primary:#7C5CFF; --primary-soft:#EFEBFF; --green:#12B76A; --green-soft:#E6F7EF;
  --orange:#F79009; --orange-soft:#FFF4E5; --red:#F04438; --red-soft:#FEECEB;
  --blue:#2E90FA; --blue-soft:#E9F3FF; --line:#EEF0F5; --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#E7E9F2;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text-1);}

/* ===== 手机壳 ===== */
.phone-wrap{display:flex;justify-content:center;align-items:flex-start;padding:24px 12px;min-height:100vh;}
.phone{width:420px;max-width:100%;background:var(--bg);border-radius:34px;box-shadow:0 24px 60px rgba(30,34,60,.22);overflow:hidden;position:relative;display:flex;flex-direction:column;height:860px;}
.phone-status{height:34px;flex:0 0 34px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:12px;color:var(--text-2);font-weight:600;}
.screen{flex:1;overflow-y:auto;scroll-behavior:smooth;}
.screen::-webkit-scrollbar{width:0}

/* ===== 手机真机全屏：去掉模拟壳 ===== */
@media (max-width:520px){
  .phone-wrap{padding:0;}
  .phone{width:100%;height:100vh;height:100dvh;border-radius:0;box-shadow:none;}
  .phone-status{display:none;}
  .page{padding-top:10px;padding-bottom:96px;}
}

/* ===== 通用 ===== */
.page{padding:14px 16px 90px;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.header{padding:10px 16px 14px;}
.app-shell .page,.page{scrollbar-width:thin}
.stat-card,.card,.order-card{transition:transform .15s ease,box-shadow .15s ease}
.order-card:active{transform:scale(.985)}
.quick-item:active{transform:scale(.94)}
.quick-item{transition:transform .12s ease}
.header.row-between{display:flex;align-items:flex-start;justify-content:space-between}
.header-title{font-size:22px;font-weight:800;letter-spacing:.3px}
.header-sub{font-size:12.5px;color:var(--text-3);margin-top:4px}
.bell{position:relative;width:40px;height:40px;border-radius:14px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 12px rgba(30,34,60,.06);cursor:pointer}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}

.card{background:var(--card);border-radius:var(--radius);padding:15px;margin-bottom:12px;box-shadow:0 4px 16px rgba(30,34,60,.05)}
.card-title{font-size:14.5px;font-weight:800;margin-bottom:10px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.row{display:flex;align-items:center;gap:8px}
.bold{font-weight:700}
.text-sm{font-size:12px}
.text-2{color:var(--text-2);font-size:13px}
.text-3{color:var(--text-3)}
.money{font-size:15px;font-weight:800;color:var(--primary)}
.money-sm{font-weight:800;color:var(--text-1);font-size:13.5px}
.money-plus{font-weight:800;color:var(--green);font-size:13.5px}
.divider{height:1px;background:var(--line);margin:11px 0}
.empty{padding:70px 20px;text-align:center;color:var(--text-3);font-size:13.5px}
.empty-emoji{display:block;font-size:44px;margin-bottom:12px}

/* ===== 标签 ===== */
.tag{padding:3px 9px;border-radius:8px;font-size:11.5px;font-weight:700;white-space:nowrap}
.tag-processing{background:var(--primary-soft);color:var(--primary)}
.tag-approved{background:var(--green-soft);color:var(--green)}
.tag-pending{background:var(--orange-soft);color:var(--orange)}
.tag-rejected{background:var(--red-soft);color:var(--red)}
.tag-overdue{background:var(--red-soft);color:var(--red)}
.tag-warn{background:var(--orange-soft);color:var(--orange)}
.tag-done{background:var(--blue-soft);color:var(--blue)}

/* ===== 按钮 ===== */
button{font-family:inherit;border:none;cursor:pointer}
.btn-primary{width:100%;padding:13px;border-radius:14px;background:linear-gradient(135deg,#8D6CFF,#6E45FF);color:#fff;font-size:15px;font-weight:800;box-shadow:0 8px 20px rgba(110,69,255,.28)}
.btn-primary:active{transform:translateY(1px)}
.btn-ghost{padding:11px;border-radius:12px;background:#F1F2F7;color:var(--text-2);font-size:13.5px;font-weight:700}
.btn-mini{padding:8px 14px;border-radius:12px;background:var(--primary);color:#fff;font-size:13px;font-weight:700}
.btn-mini-red{padding:8px 14px;border-radius:12px;background:var(--red-soft);color:var(--red);font-size:13px;font-weight:700}
.btn-mini-green{padding:8px 14px;border-radius:12px;background:var(--green);color:#fff;font-size:13px;font-weight:700}
.input{width:100%;padding:12px 14px;border-radius:13px;border:1.5px solid var(--line);background:#FAFBFC;font-size:14.5px;font-family:inherit;color:var(--text-1);outline:none}
.input:focus{border-color:var(--primary);background:#fff}
select.input{appearance:none}

/* ===== 底部 tabbar ===== */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:66px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;align-items:center;padding-bottom:4px}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--text-3);cursor:pointer;font-weight:600}
.tab-item .tab-ico{font-size:20px;filter:grayscale(1);opacity:.55}
.tab-item.on{color:var(--primary)}
.tab-item.on .tab-ico{filter:none;opacity:1;transform:translateY(-1px)}

/* ===== 首页 ===== */
.hero{background:linear-gradient(135deg,#7C5CFF,#5B34F0);color:#fff;border-radius:22px;padding:20px;margin-bottom:12px;box-shadow:0 14px 30px rgba(91,52,240,.3)}
.hero-label{font-size:12.5px;opacity:.85;font-weight:600}
.hero-money{font-size:30px;font-weight:800;margin:6px 0 4px;letter-spacing:.5px}
.hero-row{display:flex;gap:10px;margin-top:14px}
.hero-cell{flex:1;background:rgba(255,255,255,.16);border-radius:14px;padding:10px 12px}
.hero-cell .k{font-size:11.5px;opacity:.85}
.hero-cell .v{font-size:17px;font-weight:800;margin-top:3px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat-card{background:var(--card);border-radius:16px;padding:13px 12px;box-shadow:0 4px 16px rgba(30,34,60,.05)}
.stat-num{font-size:21px;font-weight:800}
.stat-label{font-size:11.5px;color:var(--text-3);font-weight:600}
.stat-money{font-size:16px;font-weight:800;color:var(--primary)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}

.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quick-item{background:var(--card);border-radius:16px;padding:14px 8px;text-align:center;box-shadow:0 4px 16px rgba(30,34,60,.05);cursor:pointer;transition:.15s}
.quick-item:active{transform:scale(.96)}
.quick-ico{font-size:24px;margin-bottom:6px}
.quick-txt{font-size:12px;font-weight:700;color:var(--text-2)}

/* ===== 进度 ===== */
.progress-wrap{margin-top:8px}
.progress-bar{height:8px;border-radius:6px;background:#F0F1F6;overflow:hidden}
.progress-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#8D6CFF,#6E45FF);transition:width .3s}
/* ===== 登录注册：校验/加载态 ===== */
.input-err{border-color:var(--red)!important;background:var(--red-soft)!important}
.field-err{display:none;color:var(--red);font-size:12.5px;margin-top:5px;line-height:1.4}
.btn-primary:disabled{opacity:.55;pointer-events:none}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;vertical-align:-2px;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(124,92,255,.15)}
.rank-row{display:flex;align-items:center;gap:10px;margin-top:10px}
.rank-no{width:24px;height:24px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;background:#F1F2F7;color:var(--text-2)}
.rank-no.g1{background:#FFF4D6;color:#B98900}
.rank-no.g2{background:#EEF0F5;color:#6B7280}
.rank-no.g3{background:#FBEADA;color:#B4691A}

/* ===== 订单卡 ===== */
.order-card{cursor:pointer;transition:.15s}
.order-card:active{background:#FAFAFE}
.card-hint{font-size:12px;color:var(--text-3);text-align:center;margin-top:-4px;margin-bottom:12px}
.alert-card{background:linear-gradient(135deg,#FFF6F5,#FFEDEB);border:1px solid #FFD9D5}
.alert-item{display:flex;justify-content:space-between;padding:7px 0;font-size:13px;border-bottom:1px dashed #FFD9D5}
.alert-item:last-child{border-bottom:none}

/* ===== 项目 / 步骤 ===== */
.step-item{padding:11px 0;border-bottom:1px solid var(--line)}
.step-item:last-child{border-bottom:none}
.step-name{font-size:14px}
.check{width:26px;height:26px;border-radius:9px;border:2px solid #D8DAE5;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:800;cursor:pointer;flex:0 0 26px;transition:.15s}
.check.on{background:var(--primary);border-color:var(--primary);box-shadow:0 4px 10px rgba(124,92,255,.35)}
.qty-row{display:flex;align-items:center;gap:10px;margin-top:9px}
.qty-input{flex:1;padding:9px 12px;font-size:14px}

.chip-wrap{display:flex;flex-wrap:wrap;gap:8px}
.chip-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:14px;background:#FAFBFC;border:1.5px solid var(--line);margin-bottom:8px;cursor:pointer;transition:.15s}
.chip-row.on{border-color:var(--primary);background:var(--primary-soft)}
.chip-name{font-size:14px;font-weight:700}
.chip-price{font-size:12.5px;color:var(--text-3)}
.chip-check{width:22px;height:22px;border-radius:8px;border:2px solid #D8DAE5;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800}
.chip-row.on .chip-check{background:var(--primary);border-color:var(--primary)}

.switch-row{display:flex;gap:10px;margin-top:8px}
.switch-btn{flex:1;padding:12px;border-radius:14px;background:#FAFBFC;border:1.5px solid var(--line);text-align:center;font-size:14px;font-weight:700;color:var(--text-2);cursor:pointer;transition:.15s}
.switch-btn.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}

.seg{display:flex;background:#F1F2F7;border-radius:14px;padding:4px;margin-bottom:14px}
.seg-item{flex:1;text-align:center;padding:9px;border-radius:11px;font-size:13.5px;font-weight:700;color:var(--text-3);cursor:pointer;transition:.15s}
.seg-item.on{background:#fff;color:var(--primary);box-shadow:0 3px 10px rgba(30,34,60,.08)}

/* ===== 加工费表格 ===== */
.pay-table{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 16px rgba(30,34,60,.05);margin-bottom:12px}
.tbl-head{display:flex;align-items:center;background:#F1F2F7;padding:9px 12px;font-size:12px;font-weight:800;color:var(--text-3)}
.tbl-row{display:flex;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px}
.tbl-row:last-child{border-bottom:none}
.tbl-row.total{background:rgba(124,92,255,.08);font-weight:800}
.col-name{flex:1.6;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.col-qty{flex:1;text-align:right}
.col-price{flex:1;text-align:right}
.col-amt{flex:1.3;text-align:right;font-weight:800;color:var(--green)}
.pick-bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pick-item{flex:1;background:#fff;border-radius:12px;padding:11px 14px;font-size:13px;text-align:center;box-shadow:0 4px 16px rgba(30,34,60,.05);cursor:pointer}
.pick-item.active{background:rgba(124,92,255,.15);color:var(--primary);font-weight:800}
.pick-item input{border:none;background:transparent;font:inherit;color:inherit;text-align:center;width:100%;outline:none}
.model-badge{display:inline-block;padding:2px 10px;border-radius:8px;background:rgba(124,92,255,.15);color:var(--primary);font-weight:800;font-size:12px}
.tabs{display:flex;gap:16px;padding:0 16px 10px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tab{font-size:13.5px;font-weight:700;color:var(--text-3);padding-bottom:8px;white-space:nowrap;cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:var(--primary);border-bottom-color:var(--primary)}

.kv{display:flex;justify-content:space-between;padding:8px 0;font-size:13.5px;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--text-3)}
.kv .v{font-weight:700;text-align:right;max-width:62%}

/* ===== 报工 ===== */
.work-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.work-row:last-child{border-bottom:none}
.work-info{flex:1;min-width:0}
.work-input-wrap{display:flex;gap:6px;align-items:center}
.work-input{width:82px;padding:9px 10px;font-size:14px;text-align:center}
.work-submit{padding:9px 13px;border-radius:11px;font-size:13px;box-shadow:none}
.detail-row{padding:9px 0;border-bottom:1px solid var(--line)}
.detail-row:last-child{border-bottom:none}

/* ===== 拍照/识别 ===== */
.cam-box{border:2px dashed #D8DAE5;border-radius:18px;padding:26px 16px;text-align:center;background:#FAFBFC}
.cam-ico{font-size:40px}
.ocr-card{background:linear-gradient(135deg,#F3F7FF,#EAF2FF);border:1px solid #DCE8FF}
.ocr-line{display:flex;justify-content:space-between;padding:7px 0;font-size:13px;border-bottom:1px dashed #DCE8FF}
.ocr-line:last-child{border-bottom:none}
.ocr-line .k{color:var(--text-3)}
.ocr-line .v{font-weight:700;text-align:right}
.screw-card{background:linear-gradient(135deg,#FFF8EC,#FFF1DC);border:1px solid #FFE0B2}
.screw-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed #FFE0B2}
.screw-row:last-child{border-bottom:none}
.screw-model-input{flex:1;border:1px solid #FFE0B2;background:#fff;border-radius:9px;padding:6px 10px;font-size:12.5px;color:var(--text);outline:none}
.screw-model-input:focus{border-color:var(--primary)}

/* 工艺提醒 */
.craft-card{border-left:4px solid var(--orange);background:linear-gradient(135deg,#FFFBF3,#FFF6E6)}
.craft-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed #FFE0B2;font-size:13px}
.craft-row:last-child{border-bottom:none}
.craft-model{min-width:64px;text-align:center;padding:4px 10px;border-radius:9px;background:var(--orange-soft);color:var(--orange);font-weight:800;font-size:12.5px}
.craft-name{flex:1;min-width:0;color:var(--text)}
.craft-qty{color:var(--text-3);font-size:12px}

/* 订单进度 */
.prog-row{margin-top:9px}
.prog-bar{height:7px;background:var(--line);border-radius:5px;margin-top:5px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,#7C5CFF,#B05CFF);border-radius:5px;transition:width .3s}
.prog-fill-full{background:var(--green)}
.prog-full{color:var(--green);font-weight:800}
.pick{padding:7px 12px;border-radius:11px;background:#fff;border:1.5px solid #FFD08A;font-size:12.5px;font-weight:700;color:#B4691A;cursor:pointer;white-space:nowrap}
.pick.on{background:var(--primary);border-color:var(--primary);color:#fff}
.dot-red{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:5px;vertical-align:middle}
.dot-green{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px;vertical-align:middle}
.snap{animation:snap .5s ease}
@keyframes snap{0%{transform:scale(.9);opacity:.4}100%{transform:scale(1);opacity:1}}

/* ===== 登录 ===== */
.login-wrap{padding:60px 26px 26px;text-align:center}
.login-logo{font-size:56px;margin-bottom:12px}
.login-title{font-size:24px;font-weight:800}
.login-sub{font-size:13px;color:var(--text-3);margin:8px 0 30px;line-height:1.6}
.login-card{background:var(--card);border-radius:22px;padding:20px;box-shadow:0 10px 30px rgba(30,34,60,.1);text-align:left}
.field{margin-bottom:12px}
.field-label{font-size:12.5px;font-weight:700;color:var(--text-2);margin-bottom:6px}
.role-btn{display:flex;align-items:center;gap:12px;padding:15px;border-radius:16px;background:var(--card);box-shadow:0 4px 16px rgba(30,34,60,.06);margin-bottom:10px;cursor:pointer;transition:.15s}
.role-btn:active{transform:scale(.98)}
.role-ico{font-size:26px}
.role-t{font-size:15px;font-weight:800}
.role-d{font-size:12px;color:var(--text-3);margin-top:2px}
.role-arrow{margin-left:auto;color:var(--text-3);font-size:18px}

/* ===== 弹窗 ===== */
.mask{position:fixed;inset:0;background:rgba(20,22,36,.5);display:flex;align-items:center;justify-content:center;padding:22px;z-index:50;animation:fade .18s}
.panel{background:#fff;border-radius:22px;padding:20px;width:100%;max-width:360px;max-height:82vh;overflow-y:auto}
.panel-title{font-size:18px;font-weight:800;text-align:center;margin-bottom:6px}
.panel-sub{font-size:12.5px;color:var(--text-3);text-align:center;margin-bottom:14px;line-height:1.6}
.modal-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border-radius:14px;background:#FAFBFC;border:1.5px solid var(--line);margin-bottom:9px}
.modal-name{font-size:13.5px;font-weight:700}
.modal-meta{font-size:11.5px;color:var(--text-3);margin-top:3px}
.mini-btn{padding:8px 13px;border-radius:11px;font-size:12.5px;font-weight:700;background:#F1F2F7;color:var(--text-2)}
.mini-btn.on{background:var(--primary);color:#fff}
.mini-btn.on-green{background:var(--green);color:#fff}

/* ===== 二维码 ===== */
.qr-box{display:flex;justify-content:center;margin:6px 0 12px}
.qr-grid{position:relative;width:168px;height:168px;background:#fff;border-radius:14px;padding:0;box-shadow:0 6px 20px rgba(30,34,60,.12)}
.qr-dot{position:absolute;width:8px;height:8px;background:#1B1D29;border-radius:2px}
.qr-code-big{text-align:center;font-size:26px;font-weight:800;letter-spacing:5px;color:var(--primary)}

/* ===== 吐司 ===== */
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(27,29,41,.92);color:#fff;padding:11px 20px;border-radius:14px;font-size:13.5px;font-weight:600;z-index:99;animation:toastIn .2s;max-width:80%;text-align:center}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</head>

  <div class="phone">
    <div class="phone-status"><span id="clock">9:41</span><span>📶 🔋 100%</span></div>
    <div class="screen" id="screen"></div>
  </div>
</div>

/* 拍照识别优化：EXIF 自动转正 → 限边 2000px → 灰度 + 对比度拉伸（单据文字更清晰）→ JPEG 直传 */
function compressImage(file, maxPx, cb){
  const done=(canvas)=>canvas.toBlob(b=>cb(b||file),'image/jpeg',0.9);
  const enhance=(img, sc)=>{
    const w=Math.round(img.width*sc), h=Math.round(img.height*sc);
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,w,h);
    try{
      const d=ctx.getImageData(0,0,w,h), px=d.data;
      /* 灰度直方图 5%~95% 分位拉伸，提升小字对比度 */
      const hist=new Array(256).fill(0); const gray=new Uint8ClampedArray(w*h);
      for(let i=0;i<px.length;i+=4){ const g=(px[i]*299+px[i+1]*587+px[i+2]*114)/1000; gray[i/4]=g; hist[g|0]++; }
      const total=w*h; let lo=0,hi=255,acc=0;
      for(let i=0;i<256;i++){ acc+=hist[i]; if(acc>=total*0.05){ lo=i; break; } }
      acc=0; for(let i=255;i>=0;i--){ acc+=hist[i]; if(acc>=total*0.05){ hi=i; break; } }
      if(hi-lo<40){ lo=0; hi=255; }
      for(let i=0,j=0;i<px.length;i+=4,j++){
        let v=(gray[j]-lo)*255/(hi-lo); v=v<0?0:v>255?255:v;
        px[i]=px[i+1]=px[i+2]=v;
      }
      ctx.putImageData(d,0,0);
    }catch(e){}
    return c;
  };
  if(window.createImageBitmap){
    createImageBitmap(file,{imageOrientation:'from-image'}).then(bmp=>{
      const sc=Math.min(1,maxPx/Math.max(bmp.width,bmp.height));
      done(enhance(bmp,sc));
    }).catch(()=>{ legacy(); });
  } else legacy();
  function legacy(){
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{ const sc=Math.min(1,maxPx/Math.max(img.width,img.height)); done(enhance(img,sc)); URL.revokeObjectURL(url); };
    img.onerror=()=>{ URL.revokeObjectURL(url); cb(file); };
    img.src=url;
  }
}

        if(!e.workNo){ e.workNo=autoWorkNo(); e.workNoAuto=true; }
        if(!e.dateStr)e.dateStr=new Date().toLocaleDateString('zh-CN');
        /* 螺丝自动预填：数量=工单数量→电路板单螺丝，否则→成品螺丝 */
        if(fl.screws&&fl.screws.length){
          e.screwList=fl.screws.map(s=>({name:s.name, model:s.model, qty:s.qty, type:Number(s.qty)===Number(e.qty)?'电路板单螺丝':'成品螺丝'}));
          state.screwChoice={};
          e.screwList.forEach((s,i)=>{ state.screwChoice['k'+i]=s.type; });
          /* 无开关未定时暂不动项目勾选，用户确认开关后手动/弹窗勾选 */
        }
        toast(Object.keys(fl).length>1?'识别完成，请核对信息':'已上传，未识别出字段，请手动填写');
      } else {
        if(!e.workNo){ e.workNo=autoWorkNo(); e.workNoAuto=true; }
        if(!e.dateStr)e.dateStr=new Date().toLocaleDateString('zh-CN');
        toast('照片已上传，识别暂不可用，请手动填写');
      }
      render();
    }).catch(()=>{
      state.ocrBusy=false;
      e.detected=true; e.screwList=[];
      if(!e.workNo){ e.workNo=autoWorkNo(); e.workNoAuto=true; }
      if(!e.dateStr)e.dateStr=new Date().toLocaleDateString('zh-CN');
      toast('网络异常，请手动填写'); render();
    });
  });
}

/* ---------- 登录表单：实时校验 / 防重复提交 / 超时与错误分类 ---------- */
const RE_PHONE=/^1\d{10}$/;
function fieldErr(id,msg){ const el=$(id); if(el){ el.classList.toggle('input-err',!!msg); } const tip=$('err_'+id); if(tip){ tip.textContent=msg||''; tip.style.display=msg?'block':'none'; } }
function chkPhone(v){ v=(v||'').trim(); if(!v)return '请输入手机号'; if(!RE_PHONE.test(v))return '手机号格式不正确'; return ''; }
function chkPwd(v){ v=(v||''); if(!v)return '请输入密码'; if(v.length<6)return '密码至少6位字符'; return ''; }
function liveChkLogin(){
  const p=$('phone'), w=$('pwd');
  if(!p||!w)return;
  const pe=chkPhone(p.value), we=chkPwd(w.value);
  /* 输入中只在“从错改对”时消错，不提前报错（不干扰输入） */
  if(!pe){ fieldErr('phone',''); }
  if(!we){ fieldErr('pwd',''); }
}
function setBtnLoading(id,on,txt){ const b=$(id); if(!b)return; if(on){ b.disabled=true; b.dataset.t=b.textContent; b.innerHTML='<span class="spin"></span> '+(txt||'请稍候…'); } else { b.disabled=false; if(b.dataset.t)b.textContent=b.dataset.t; } }
function fetchTimeout(url,opts,ms){ opts=opts||{}; const c=new AbortController(); const t=setTimeout(()=>c.abort(), ms||10000); opts.signal=c.signal; return fetch(url,opts).finally(()=>clearTimeout(t)); }
function applyLoginResult(j){
  if(j&&j.db&&j.db.users&&j.db.orders){ Object.keys(DB).forEach(k=>delete DB[k]); Object.assign(DB,j.db); try{ localStorage.setItem('factory_db_v2', JSON.stringify(DB)); }catch(e){} }
  if(j&&j.token){ try{ localStorage.setItem('factory_token', j.token); }catch(e){} }
  state.user=(j&&j.user&&DB.users.find(x=>x.phone===(j.user.phone||'')))||j.user;
}
let __loginBusy=false;
function login(){
  if(__loginBusy) return;                     /* 防重复提交：请求返回前忽略再次点击 */
  const phone=($('phone')?.value||'').trim(), pwd=($('pwd')?.value||'');
  const pe=chkPhone(phone), we=chkPwd(pwd);
  fieldErr('phone',pe); fieldErr('pwd',we);
  if(pe||we) return;                          /* 提交前硬校验 */
  __loginBusy=true; setBtnLoading('btnLogin',true,'登录中…');
  const done=()=>{ __loginBusy=false; setBtnLoading('btnLogin',false); };
  const saveCred=()=>{ if(state.rememberPwd){ try{ localStorage.setItem('factory_login', JSON.stringify({phone,pwd})); }catch(e){} } else { try{ localStorage.removeItem('factory_login'); }catch(e){} } };
  /* ① 本地已有该账号：离线也能登录 */
  const u=DB.users.find(x=>x.phone===phone&&x.pwd===pwd);
  if(u){ saveCred(); state.user=u; done(); afterLogin(); return; }
  /* ② 服务器验证兜底（10秒超时；错误码区分原因） */
  probeApi().then(base=>fetchTimeout(base+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,pwd})}))
    .then(r=>r.json()).then(j=>{
      if(j&&j.ok&&j.user){
        applyLoginResult(j); saveCred();
        toast('登录成功，欢迎 '+state.user.name);
        done(); afterLogin(); return;
      }
      const msg=(j&&j.message)||'手机号或密码错误';
      fieldErr('pwd',msg); toast(msg); done();
    })
    .catch(e=>{
      const msg=(e&&e.name==='AbortError')?'网络超时，请检查网络后重试':'网络连接失败，请检查网络后重试';
      fieldErr('pwd',msg); toast(msg); done();
    });
}
function quickLogin(role){
  state.user=DB.users.find(x=>x.role===role);
  afterLogin();
}
function afterLogin(){
  if(isAdminUser(state.user)){
    state.adminTab='dashboard';state.view='dashboard';
    /* 超管首次登录：引导先创建管理员和员工 */

function logout(){
  /* 完整退出：销毁服务器端 token + 清空本地凭证 */
  try{
    const token=localStorage.getItem('factory_token');
    if(token){ probeApi().then(base=>fetch(base+'/api/logout',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({token})})).catch(()=>{}); }
  }catch(e){}
  try{ localStorage.removeItem('factory_token'); localStorage.removeItem('factory_login'); }catch(e){}
  state.user=null;state.view='login';state.activeTab='';state.rememberPwd=false;render();
}

/* ---------- 注册表单：实时校验（输入中从错改对即消错，不提前报错） ---------- */
function liveChkReg(id){
  const el=$(id); if(!el)return;
  const v=el.value||'';
  let msg='';
  if(id==='regPhone'&&v&&!RE_PHONE.test(v)) msg='手机号格式不正确';
  if(id==='regPwd'&&v&&v.length<6) msg='密码至少6位字符';
  if(id==='regPwd2'&&v&&$('regPwd')&&v!==$('regPwd').value) msg='两次密码不一致';
  fieldErr(id,msg);
  if(id==='regPwd'&&$('regPwd2')&&$('regPwd2').value&&$('regPwd2').value===v) fieldErr('regPwd2','');
}
let __regBusy=false;
function register(){
  if(__regBusy) return;                        /* 防重复提交 */
  const code=($('regCode')?.value||'').trim().toUpperCase();
  const name=($('regName')?.value||'').trim();
  const phone=($('regPhone')?.value||'').trim();
  const p1=($('regPwd')?.value||''), p2=($('regPwd2')?.value||'');
  /* 提交前硬校验（错误码 → 友好中文提示，与服务器一致） */
  const errs={
    regCode: code?'' : '请输入邀请码',
    regName: name?'' : '请填写姓名',
    regPhone: phone?chkPhone(phone) : '请填写手机号',
    regPwd: p1?chkPwd(p1) : '请设置密码'
  };
  errs.regPwd2 = p1!==p2 ? '两次密码不一致' : '';
  let bad=false;
  Object.keys(errs).forEach(k=>{ fieldErr(k,errs[k]); if(errs[k])bad=true; });
  if(bad) return;
  __regBusy=true; setBtnLoading('btnReg',true,'注册中…');
  const done=()=>{ __regBusy=false; setBtnLoading('btnReg',false); };
  /* 服务器端注册：邀请码/手机号唯一性均在服务器校验（互斥锁防并发重复注册） */
  probeApi().then(base=>fetchTimeout(base+'/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,name,phone,pwd})}))
    .then(r=>r.json()).then(j=>{
      if(j&&j.ok&&j.user){
        applyLoginResult(j);
        try{ localStorage.setItem('factory_login', JSON.stringify({phone,pwd})); }catch(e){}
        state.rememberPwd=true;
        toast('注册成功，欢迎 '+name);
        done(); afterLogin(); return;
      }
      const msg=(j&&j.message)||'注册失败，请稍后重试';
      /* 把错误定位到对应输入框 */
      const c=j&&j.code;
      const map={INVITE_REQUIRED:'regCode',INVITE_INVALID:'regCode',INVITE_USED:'regCode',INVITE_EXPIRED:'regCode',PHONE_EXISTS:'regPhone',BAD_PHONE:'regPhone',WEAK_PWD:'regPwd',NAME_REQUIRED:'regName'};
      fieldErr(map[c]||'regPwd2',msg); toast(msg); done();
    })
    .catch(e=>{
      /* 服务器不可达：降级为本地注册（局域网/离线可用），同步后自动归一 */
      const msg=(e&&e.name==='AbortError')?'网络超时，已切换离线注册':'网络异常，已切换离线注册';
      toast(msg);
      if(DB.users.some(u=>u.phone===phone)){ fieldErr('regPhone','该手机号已注册，请直接登录'); done(); return; }
      const inv=DB.invites.find(i=>i.code===code&&!i.used);
      if(!inv){ fieldErr('regCode','邀请码无效或已被使用'); done(); return; }
      if((inv.expireAt||0)<Date.now()){ fieldErr('regCode','邀请码已过期'); done(); return; }
      const role=inv.role==='admin'?'admin':'worker';
      const nu={id:uid('u_'),name,phone,workNo:(role==='admin'?'A':'W')+String(Date.now()).slice(-5),role,status:'active',pwd:p1};
      DB.users.push(nu); inv.used=true;
      DB.notices.unshift({id:uid('n_'),type:'system',title:'新用户注册',text:`${name}（${phone}）已通过邀请码注册为${role==='admin'?'管理员':'员工'}`,ts:Date.now(),read:false});
      saveDb(); state.user=nu;
      toast('注册成功，欢迎 '+name);
      done(); afterLogin();
    });
}
function go(v,tab){
  state.view=v;
  if(tab!==undefined)state.activeTab=tab;
  if(v==='myOrders')state.activeTab='myOrders';

  render();
}

function vOrders(){

function setSwitch(v){
  const e=state.entry; e.hasSwitch=v;
  const insul=DB.projects.find(p=>p.name==='插绝缘片');
  const set=new Set(e.projectIds);
  if(v===false){ if(insul) set.add(insul.id); }
  else { if(insul) set.delete(insul.id); }
  e.projectIds=[...set];
  toast(v?'已标记：有开关':'已标记：无开关（自动添加插绝缘片）');
  render();
}
function toggleProject(pid){
  const e=state.entry, i=e.projectIds.indexOf(pid);
  if(i>=0)e.projectIds.splice(i,1); else e.projectIds.push(pid);
  render();
}
function saveOrder(){
  const e=state.entry;
  if(!e.detected){toast('请先拍照或点「直接填写」');return;}
  if(!(e.productName||'').trim()){toast('请填写成品名称');return;}
  if(!(Number(e.qty)>0)){toast('请填写成品数量');return;}
  if(e.hasSwitch===null){toast('请先判定「有开关 / 无开关」');return;}
  if(e.projectIds.length===0){toast('请至少选择一个加工项目');return;}
  if(!(e.workNo||'').trim()){e.workNo=autoWorkNo();}
  const qty=Number(e.qty)||0;
  const steps=e.projectIds.map((pid,i)=>{
    const p=DB.projects.find(x=>x.id===pid)||{name:pid,price:0};
    return {id:'s_'+e.workNo+'_'+i, name:p.name, price:p.price, totalQty:qty, assignedQty:0};
  });
  /* 螺丝型号 → 工艺提醒（员工端可见） */
  const screwNotes=(e.screwList||[]).filter(s=>s.name).map(s=>({name:s.name, model:s.model||'', qty:s.qty||qty}));
  const o={id:'o_'+e.workNo, workNo:e.workNo, saleNo:e.saleNo, productNo:e.productNo, productName:e.productName, qty, dateStr:e.dateStr, hasSwitch:e.hasSwitch, deliveryDate:e.deliveryDate, steps, screwNotes, photo:(e.photo&&String(e.photo).indexOf('/photos/')===0)?e.photo:'', allocated:false, createdBy:(state.user||{}).name||'', createdAt:Date.now()};
  const ex=DB.orders.findIndex(x=>x.workNo===e.workNo);
  if(ex>=0)DB.orders[ex]=o; else DB.orders.unshift(o);
  DB.notices.unshift({id:uid('n_'),type:'system',title:'新工单已录入',text:`${o.workNo}（${o.productName}）已录入，等待分单`,ts:Date.now(),read:false});
  state.entry={workNo:'',saleNo:'',productNo:'',productName:'',qty:'',dateStr:'',hasSwitch:null,deliveryDate:'',projectIds:[],screwList:[],photo:null,photoLocal:null,detected:false,workNoAuto:false};
  toast('已保存，进入待申领池');
  state.entryOrderId=o.id; go('orderDetail');
}

/* 删除订单（管理员）：同时清理相关申领/报工数据 */
function delOrder(oid){
  const o=getOrder(oid);
  if(!o)return;
  if(!confirm('确定删除订单 '+o.workNo+'（'+o.productName+'）？\n相关的申领和报工记录也会一并删除，不可恢复！'))return;
  DB.orders=DB.orders.filter(x=>x.id!==oid);
  DB.claims=DB.claims.filter(c=>c.orderId!==oid);
  DB.records=(DB.records||[]).filter(r=>r.orderId!==oid);
  DB.works=DB.works.filter(w=>w.orderId!==oid);
  toast('订单已删除');
  state.view='orders'; render();
}

function setStepPrice(oid,sid,v){const o=getOrder(oid);const s=o.steps.find(x=>x.id===sid);if(s){s.price=Number(v)||0;let n=0;DB.works.forEach(w=>{if(w.orderId===oid&&w.stepId===sid){w.price=s.price;w.amount=Number((w.qty*s.price).toFixed(2));n++;}});saveDb();toast(n?('单价已保存，'+n+'笔报工金额已更新'):'单价已保存');render();}}
function genAlloc(oid){
  const o=getOrder(oid);
  const noPrice=o.steps.filter(s=>!s.price);
  o.steps.forEach(s=>{s.assignedQty=s.totalQty;});
  o.allocated=true;
  DB.notices.unshift({id:uid('n_'),type:'claim',title:'分单完成',text:`${o.workNo} 已生成分配${noPrice.length?('（'+noPrice.map(s=>s.name).join('、')+'暂未定价，可随时补录）'):''}，员工可开始申领`,ts:Date.now(),read:false});
  toast(noPrice.length?'已生成分配（未定价项目也已投入申领池）':'已生成分配，员工可申领');
  render();
}

function groupByDay(works){

/* 按员工汇总成支付表行 */
function summarizeByWorker(works){
  const map=new Map();
  works.forEach(w=>{const k=w.workerId;if(!map.has(k))map.set(k,[]);map.get(k).push(w);});
  return [...map.entries()].map(([uidv,list])=>{

  }).sort((a,b)=>b.amount-a.amount);
}
function salaryRangeBar(prefix){

/* 按订单结算：订单 → 每个加工人员各自的项目/数量/金额（发钱用）+ 超量校验 */
function buildOrderSettlement(works){
  const map=new Map();
  works.forEach(w=>{const k=w.orderId;if(!map.has(k))map.set(k,[]);map.get(k).push(w);});
  return [...map.entries()].map(([oid,list])=>{
    const o=getOrder(oid)||{steps:[],qty:0};
    const steps=(o.steps||[]).map(s=>{
      const ws=list.filter(w=>w.stepId===s.id);
      const done=ws.reduce((s2,w)=>s2+w.qty,0);
      const amount=ws.reduce((s2,w)=>s2+w.amount,0);
      const total=Number(s.totalQty)||Number(o.qty)||0;
      return {id:s.id,name:s.name,price:Number(s.price)||0,total,done,remain:total-done,amount,over:done>total};
    });
    // 按加工人员汇总
    const wmap=new Map();
    list.forEach(w=>{
      const wid=w.workerId||'unknown';
      if(!wmap.has(wid))wmap.set(wid,new Map());
      const m2=wmap.get(wid);
      const st=steps.find(x=>x.id===w.stepId)||{name:w.stepId,price:w.price||0};
      if(!m2.has(w.stepId))m2.set(w.stepId,{name:st.name,price:Number(w.price)||0,qty:0,amount:0});
      const it=m2.get(w.stepId);it.qty+=w.qty;it.amount+=w.amount;
    });
    const workers=[...wmap.entries()].map(([wid,m2])=>{
      const u=DB.users.find(x=>x.id===wid)||{};
      const items=[...m2.values()];
      return {id:wid,name:u.name||'未知',workNo:u.workNo||'',count:list.filter(w=>w.workerId===wid).length,qty:items.reduce((s,x)=>s+x.qty,0),amount:items.reduce((s,x)=>s+x.amount,0),items};
    }).sort((a,b)=>b.amount-a.amount);
    return {key:oid,workNo:o.workNo||'—',productName:o.productName||'',orderQty:Number(o.qty)||0,count:list.length,qty:list.reduce((s,w)=>s+w.qty,0),amount:list.reduce((s,w)=>s+w.amount,0),steps,workers,hasOver:steps.some(s=>s.over)};
  }).sort((a,b)=>b.amount-a.amount);
}

function addUser(){

  if(!name||!phone){toast('请填写姓名和手机号');return;}
  if(DB.users.some(u=>u.phone===phone)){toast('手机号已存在');return;}
  const role=state.inviteRole;
  if(role==='admin'&&!isSuper()){toast('仅最高权限可添加管理员');return;}
  DB.users.push({id:uid('u_'),name,phone,workNo:(role==='admin'?'A':'W')+String(Date.now()).slice(-5),role,status:'active',pwd});

function addAdmin(){addUser();}
function removeUser(id){
  const u=DB.users.find(x=>x.id===id);
  if(!u)return;
  if(u.role==='superadmin'){toast('最高权限账号不可删除');return;}
  if(u.role==='admin'&&!isSuper()){toast('仅最高权限可移除管理员');return;}
  if(u.role==='admin'&&DB.users.filter(x=>x.role==='admin').length<=1){toast('至少保留一名管理员');return;}
  /* 级联清除：该员工的报工/申领/改数申请一并删除，工资统计不再显示已删员工 */
  const wN=DB.works.filter(w=>w.workerId===id).length;
  const cN=DB.claims.filter(c=>c.workerId===id).length;
  if(!confirm('确定移除 '+u.name+' 吗？\n其名下 '+wN+' 笔报工、'+cN+' 条申领及全部加工费将一并删除，不可恢复！'))return;
  DB.works=DB.works.filter(w=>w.workerId!==id);
  DB.claims=DB.claims.filter(c=>c.workerId!==id);
  DB.editRequests=(DB.editRequests||[]).filter(r=>r.workerId!==id);
  DB.users=DB.users.filter(x=>x.id!==id);
  DB.notices.unshift({id:uid('n_'),type:'system',title:'成员已移除',text:u.name+' 已被移除，其名下 '+wN+' 笔报工记录已清除',ts:Date.now(),read:false});
  saveDb();
  toast('已移除并清除相关数据');render();
}
function createInvite(){
  const code=genCode(6);
  DB.invites.unshift({id:uid('i_'),code,role:state.inviteRole,expireAt:Date.now()+7*864e5,used:false});
  state.currentQr={code,role:state.inviteRole,roleText:state.inviteRole==='admin'?'管理员':'员工',dots:genQrDots(code)};

function prevWorkerName(uid_){const u=DB.users.find(x=>x.id===uid_);return u?u.name:'—';}
function genCode(len){const c='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let o='';for(let i=0;i<len;i++)o+=c[Math.floor(Math.random()*c.length)];return o;}
function genQrDots(code){
  /* 真二维码：内容为 注册页链接（带邀请码），手机扫码直达注册并自动填入 */
  try{
    if(typeof qrcode==='function'){
      const base=(location.origin&&location.origin.startsWith('http'))?location.origin+location.pathname:'https://nbxsxsl.github.io/factory-app/';
      const qr=qrcode(0,'M'); qr.addData(base+'?invite='+code); qr.make();
      const n=qr.getModuleCount(); const dots=[];
      for(let y=0;y<n;y++)for(let x=0;x<n;x++) if(qr.isDark(y,x)) dots.push({x,y});
      state.qrCell=Math.floor(168/n); state.qrSize=n;
      return dots;
    }
  }catch(e){}
  return [];  /* 库不可用时不渲染伪码，避免误导扫码 */
}

  <div class="qr-code-big">${q.code}</div><div class="text-sm text-3" style="text-align:center;margin-top:6px">成员扫码或输入此邀请码加入</div>

/* 勾选 / 取消勾选 */
function pickStep(oid,sid){
  if(!state.pick) state.pick={};
  if(!state.qty) state.qty={};
  const o=state.pick[oid]||(state.pick[oid]={});
  if(o[sid]){ delete o[sid]; if(state.qty[oid]) delete state.qty[oid][sid]; }
  else {
    o[sid]=true;
    const sr=orderStepsWithRemain(oid).find(x=>x.id===sid);
    if(!state.qty[oid]) state.qty[oid]={};
    state.qty[oid][sid]=String(sr?sr.remainQty:'');   /* 默认填满剩余量，可改 */
  }
  render();
}
function setQty(oid,sid,v){
  if(!state.qty) state.qty={};
  if(!state.qty[oid]) state.qty[oid]={};
  state.qty[oid][sid]=v;
  /* 不整体 render，避免输入框失焦；仅校验最大值提示 */
}
function fillMax(oid,sid){
  const sr=orderStepsWithRemain(oid).find(x=>x.id===sid);
  if(!state.qty) state.qty={};
  if(!state.qty[oid]) state.qty[oid]={};
  state.qty[oid][sid]=String(sr?sr.remainQty:'');
  render();
}
/* 兼容旧名 */
function toggleStep(oid,sid){pickStep(oid,sid);}

function submitClaim(oid){
  const o=getOrder(oid);
  const pickMap=state.pick[oid]||{};
  const sel=o.steps.filter(s=>pickMap[s.id]);
  if(sel.length===0){toast('请先勾选要申领的项目');return;}
  const remainMap={};orderStepsWithRemain(oid).forEach(s=>remainMap[s.id]=s.remainQty);
  const items=[];
  for(const s of sel){
    const q=Number((state.qty[oid]||{})[s.id]);
    if(!q||q<=0){toast('请填写「'+s.name+'」的申领数量');return;}
    if(q>remainMap[s.id]){toast('「'+s.name+'」超过剩余 '+remainMap[s.id]);return;}
    items.push({stepId:s.id, qty:q});
  }
  DB.claims.push({id:uid('c_'),orderId:oid,items,itemIds:items.map(it=>it.stepId),workerId:state.user.id,status:'pending',time:todayStr()+' '+new Date().toTimeString().slice(0,5)});
  DB.notices.unshift({id:uid('n_'),type:'claim',title:'新申领待审批',text:`${state.user.name} 提交了 ${o.workNo} 的申领（${items.length} 项）`,ts:Date.now(),read:false});
  state.pick[oid]={}; state.qty[oid]={};
  toast('申领已提交，等待审批');
  state.myClaimsTab='all'; go('myClaims');
}

  ${(()=>{const p=orderReportProgress(claim.orderId);return `<div class="card"><div class="row-between"><div class="card-title" style="margin:0">📊 订单进度</div><div class="text-sm text-3">${p.percent}%</div></div>${p.rows.map(r=>`<div class="prog-row"><div class="row-between"><div class="text-2">${r.name}</div><div class="text-sm ${r.reported>=r.total?'prog-full':'text-3'}">${r.reported} / ${r.total}</div></div><div class="prog-bar"><div class="prog-fill ${r.reported>=r.total?'prog-fill-full':''}" style="width:${r.percent}%"></div></div></div>`).join('')}</div>`;})()}
  <div class="card"><div class="card-title">录入完成数量</div>
    ${items.map(it=>{const rep=DB.works.filter(w=>w.orderId===claim.orderId&&w.stepId===it.id).reduce((s,w)=>s+w.qty,0);const total=it.orderQty;const remain=total-rep;return `<div class="work-row"><div class="work-info"><div class="bold">${it.name}</div><div class="text-sm text-3">单价 ¥${it.price} · 申领 ${it.totalQty}</div>${total>0?`<div class="text-sm" style="color:${remain>0?'var(--green)':'var(--red)'}">已报 ${rep} / 订单 ${total} · ${remain>0?'还可报 '+remain+' 件':'已报满，不可再报'}</div>`:''}</div>
      <div class="work-input-wrap"><input class="input work-input" type="number" placeholder="数量" id="wi_${it.id}"><button class="btn-primary work-submit" onclick="submitWork('${claim.id}','${it.id}',${it.price})">报工</button></div></div>`;}).join('')}</div>
  <div class="card"><div class="card-title">今日报工明细</div>
    ${todayList.length===0?'<div class="text-sm text-3">今天还没有报工记录</div>':todayList.map(w=>`<div class="row-between detail-row"><div><div class="text-2">${w.stepName} × ${w.qty}</div><div class="text-sm text-3">${w.timeText}</div></div><div class="row" style="gap:8px;align-items:center"><div class="text-sm" style="color:var(--primary);cursor:pointer" onclick="openWorkEdit('${w.id}')">✏️改</div><div class="text-sm" style="color:var(--red);cursor:pointer" onclick="withdrawWork('${w.id}')">↩️撤回</div><div class="money-plus">+¥${money(w.amount)}</div></div></div>`).join('')}</div>
  </div>`;
}
function withdrawWork(wid){
  const w=DB.works.find(x=>x.id===wid); if(!w)return;
  if(!isToday(w.ts)){toast('只能撤回今天的报工');return;}
  if(!confirm('确定撤回这笔报工吗？（'+w.qty+'件）'))return;
  const o=getOrder(w.orderId)||{steps:[]};const s=(o.steps||[]).find(x=>x.id===w.stepId)||{};
  DB.works=DB.works.filter(x=>x.id!==wid);
  DB.editRequests=(DB.editRequests||[]).filter(r=>r.workId!==wid);
  DB.notices.unshift({id:uid('n_'),type:'claim',title:'员工撤回报工',text:`${state.user.name} 撤回了 ${o.workNo||''}「${s.name||''} × ${w.qty}」的报工`,ts:Date.now(),read:false});
  saveDb(); toast('已撤回'); render();
}
function submitWork(cid,sid,price){
  const el=$('wi_'+sid);const qty=el?Number(el.value):0;
  if(!qty||qty<=0){toast('请输入完成数量');return;}
  const claim=DB.claims.find(c=>c.id===cid);
  // 校验：项目单项合计不可超过订单数量（≤ 可以）
  const order=getOrder(claim.orderId)||{steps:[],qty:0};
  const step=(order.steps||[]).find(x=>x.id===sid)||{};
  const total=Number(step.totalQty)||Number(order.qty)||0;
  const reported=DB.works.filter(w=>w.orderId===claim.orderId&&w.stepId===sid).reduce((s,w)=>s+w.qty,0);
  const remain=total-reported;
  if(qty>remain){
    alert('⚠️ 报工失败 · 超出订单数量\n「'+(step.name||sid)+'」已报 '+reported+' / '+total+' 件，最多再报 '+Math.max(0,remain)+' 件');
    return;
  }
  DB.works.push({id:uid('k_'),claimId:cid,workerId:state.user.id,orderId:claim.orderId,stepId:sid,qty,price,amount:Number((qty*price).toFixed(2)),ts:Date.now()});
  toast('已报工 ¥'+money(qty*price));render();
}

/* ---------- 报工数量修改（员工申请→管理员审核；管理员可直接改） ---------- */
function openWorkEdit(wid){ state.workEditId=wid; state.workEditVal=''; state.workEditAdmin=false; render(); }
function openAdminWorkEdit(wid){ state.workEditId=wid; state.workEditVal=''; state.workEditAdmin=true; render(); }
function setWorkEditVal(v){ state.workEditVal=v; }
function workEditModal(){
  const w=DB.works.find(x=>x.id===state.workEditId); if(!w)return '';
  const o=getOrder(w.orderId)||{steps:[]};const s=(o.steps||[]).find(x=>x.id===w.stepId)||{};
  const pend=!state.workEditAdmin&&DB.editRequests.some(r=>r.workId===w.id&&r.status==='pending');
  return `<div class="mask" onclick="state.workEditId=null;render()"><div class="panel" onclick="event.stopPropagation()">
    <div class="panel-title">✏️ 修改报工数量</div>
    <div class="panel-sub">${s.name||''} · 当前 ${w.qty} 件 · ¥${money(w.amount)}</div>
    ${pend?'<div class="text-sm" style="color:var(--orange)">该笔已有一份待审核的修改申请，请等待管理员处理</div>':`
    <input class="input" type="number" style="width:100%" placeholder="输入正确数量" value="${state.workEditVal||''}" oninput="setWorkEditVal(this.value)">
    <button class="btn-primary" style="margin-top:10px;width:100%" onclick="confirmWorkEdit()">${state.workEditAdmin?'直接修改生效':'提交修改申请'}</button>
    ${state.workEditAdmin?'':'<div class="text-sm text-3" style="margin-top:6px">提交后需管理员审核，通过后才生效并重算金额</div>'}`}
    <button class="btn-ghost" style="width:100%;margin-top:8px" onclick="state.workEditId=null;render()">取消</button>
  </div></div>`;
}
function applyWorkQty(w,nq){ w.qty=nq; const o=getOrder(w.orderId)||{steps:[]};const s=(o.steps||[]).find(x=>x.id===w.stepId)||{};const p=Number(s.price)||w.price||0;w.price=p;w.amount=Number((w.qty*p).toFixed(2)); }
function confirmWorkEdit(){
  const w=DB.works.find(x=>x.id===state.workEditId); if(!w)return;
  const nq=Number(state.workEditVal);
  if(!nq||nq<=0){toast('请输入正确数量');return;}
  if(nq===w.qty){toast('数量未变化');return;}
  if(state.workEditAdmin){
    applyWorkQty(w,nq);
    const u=DB.users.find(x=>x.id===w.workerId)||{};
    DB.notices.unshift({id:uid('n_'),type:'claim',title:'管理员修改报工',text:`${u.name||''} 的报工数量已由管理员改为 ${nq} 件，金额已重算`,ts:Date.now(),read:false});
    state.workEditId=null; saveDb(); toast('已修改并生效'); render(); return;
  }
  DB.editRequests.push({id:uid('e_'),workId:w.id,workerId:w.workerId,orderId:w.orderId,stepId:w.stepId,oldQty:w.qty,newQty:nq,status:'pending',time:todayStr()+' '+new Date().toTimeString().slice(0,5)});
  DB.notices.unshift({id:uid('n_'),type:'system',title:'修改申请已提交',text:'报工数量修改申请已提交，等待管理员审核',ts:Date.now(),read:false});
  state.workEditId=null; saveDb(); toast('已提交，等待管理员审核'); render();
}
function approveWorkEdit(rid){
  const r=DB.editRequests.find(x=>x.id===rid); if(!r)return;
  const w=DB.works.find(x=>x.id===r.workId);
  if(w)applyWorkQty(w,r.newQty);
  r.status='approved';
  DB.notices.unshift({id:uid('n_'),type:'claim',title:'报工修改已通过',text:`报工数量 ${r.oldQty} → ${r.newQty} 件已生效，金额已重算`,ts:Date.now(),read:false});
  saveDb(); toast('已通过并生效'); render();
}
function rejectWorkEdit(rid){
  const r=DB.editRequests.find(x=>x.id===rid); if(!r)return;
  r.status='rejected'; r.reason='管理员驳回';
  DB.notices.unshift({id:uid('n_'),type:'claim',title:'报工修改被驳回',text:`${r.oldQty} → ${r.newQty} 件的修改申请被驳回`,ts:Date.now(),read:false});
  saveDb(); toast('已驳回'); render();
}

  ${works.length===0?'<div class="empty"><span class="empty-emoji">💤</span>该时段暂无加工费</div>':''}
  ${mode==='summary'&&items.length>0?`<div class="pay-table">
    <div class="tbl-head"><div class="col-name">项目</div><div class="col-qty">数量</div><div class="col-price">单价</div><div class="col-amt">金额</div></div>
    ${items.map(it=>`<div class="tbl-row"><div class="col-name">${it.name}</div><div class="col-qty">${it.qty}</div><div class="col-price">¥${money(it.price)}</div><div class="col-amt">¥${money(it.amount)}</div></div>`).join('')}
    <div class="tbl-row total"><div class="col-name">合计（${works.length} 笔）</div><div class="col-qty">${totalQty}</div><div class="col-price"></div><div class="col-amt">¥${money(total)}</div></div>
  </div>`:''}
  ${mode==='byorder'?(()=>{const omap=new Map();works.forEach(w=>{if(!omap.has(w.orderId))omap.set(w.orderId,{no:(getOrder(w.orderId)||{}).workNo||'—',qty:0,amount:0,count:0,steps:new Map()});const g=omap.get(w.orderId);g.qty+=w.qty;g.amount+=w.amount;g.count+=1;const o=getOrder(w.orderId)||{steps:[]};const s=(o.steps||[]).find(x=>x.id===w.stepId)||{};const nm=s.name||w.stepId;if(!g.steps.has(nm))g.steps.set(nm,{qty:0,amount:0});const st=g.steps.get(nm);st.qty+=w.qty;st.amount+=w.amount;});const groups=[...omap.entries()].sort((a,b)=>b[0]<a[0]?-1:1);return groups.map(([oid,g])=>`<div class="card"><div class="row-between"><div class="bold">📋 ${g.no}</div><div class="money-plus">¥${money(g.amount)}</div></div><div class="text-sm text-3" style="margin:4px 0 8px">${g.count} 笔 · 共 ${g.qty} 件</div><div class="pay-table">${[...g.steps.entries()].map(([nm,st])=>`<div class="tbl-row"><div class="col-name">${nm}</div><div class="col-qty">${st.qty}</div><div class="col-amt">¥${money(st.amount)}</div></div>`).join('')}</div></div>`).join('');})():''}
  ${mode==='detail'&&details.length>0?`<div class="pay-table">
    <div class="tbl-head"><div style="width:28px">#</div><div style="width:96px">工单号</div><div style="width:90px">项目</div><div style="width:60px;text-align:right">数量</div><div style="width:56px;text-align:right">单价</div><div style="width:70px;text-align:right">金额</div><div style="width:74px;text-align:right">日期</div></div>
    ${details.map((w,i)=>{const o=getOrder(w.orderId)||{steps:[]};const s=(o.steps||[]).find(x=>x.id===w.stepId)||{};return `<div class="tbl-row"><div style="width:28px" class="text-3">${i+1}</div><div style="width:96px">${o.workNo||'—'}</div><div style="width:90px">${s.name||w.stepId}</div><div style="width:60px;text-align:right">${w.qty} <span style="color:var(--primary);cursor:pointer" onclick="openWorkEdit('${w.id}')">✏️</span></div><div style="width:56px;text-align:right">¥${money(w.price)}</div><div style="width:70px;text-align:right" class="money-plus">¥${money(w.amount)}</div><div style="width:74px;text-align:right" class="text-3">${dayKey(w.ts).slice(5)}</div></div>`;}).join('')}

/* =========================================================
   提示

let toastTimer=null;
function toast(msg){
  let t=document.querySelector('.toast'); if(t)t.remove();
  t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.remove(),2000);
}
function bindClock2(){bindClock();}
setInterval(()=>{const c=$('clock');if(c)c.textContent=new Date().toTimeString().slice(0,5);},30000);

/* 同步状态指示器：右下角小胶囊，显示数据是否已备份到本机 */
function syncIndicator(){
  let el=document.getElementById('sync-dot');
  if(!el){
    el=document.createElement('div'); el.id='sync-dot';
    el.style.cssText='position:fixed;top:5px;left:50%;transform:translateX(-50%);z-index:9999;font-size:10.5px;padding:2px 9px;border-radius:999px;background:rgba(0,0,0,.38);color:#fff;font-family:sans-serif;pointer-events:none;white-space:nowrap;';
    document.body.appendChild(el);
  }
  const m={idle:'○ 待同步',syncing:'◌ 同步中…',ok:'● 已备份到本机',err:'⚠ 备份失败',offline:'○ 离线(仅本地)'};
  const s=__syncStatus||'idle';
  el.textContent=m[s]||s;
  el.style.background=s==='ok'?'rgba(34,160,80,.85)':s==='err'?'rgba(200,60,50,.85)':s==='syncing'?'rgba(0,120,200,.85)':'rgba(0,0,0,.55)';
}
setInterval(syncIndicator,2000); syncIndicator();

/* 启动：自动恢复登录态 —— token 优先（7天有效期，过期自动跳登录页），其次记住的密码 */
(async function(){
  try{
    const token=localStorage.getItem('factory_token');
    if(token){
      const base=await probeApi();
      try{
        const r=await fetchTimeout(base+'/api/check',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({token})});
        const j=await r.json();
        if(j&&j.ok&&j.user){
          if(j.db&&j.db.users&&j.db.orders){ Object.keys(DB).forEach(k=>delete DB[k]); Object.assign(DB,j.db); try{ localStorage.setItem('factory_db_v2', JSON.stringify(DB)); }catch(e){} }
          state.user=DB.users.find(x=>x.phone===j.user.phone)||j.user;
          state.rememberPwd=true; afterLogin(); return;
        }
      }catch(e){}
      try{ localStorage.removeItem('factory_token'); }catch(e){}   /* token 过期 → 清除，走下方密码或登录页 */
    }
    const saved=JSON.parse(localStorage.getItem('factory_login')||'null');
    if(saved&&saved.phone&&saved.pwd){
      const u=DB.users.find(x=>x.phone===saved.phone&&x.pwd===saved.pwd);
      if(u){ state.user=u; state.rememberPwd=true; afterLogin(); return; }
      /* 本地无此账号（如换设备/数据被清）：服务器验证恢复 */
      try{
        const base=await probeApi();
        const r=await fetchTimeout(base+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:saved.phone,pwd:saved.pwd})});
        const j=await r.json();
        if(j&&j.ok&&j.user){ applyLoginResult(j); state.rememberPwd=true; afterLogin(); return; }
      }catch(e){}
    }
  }catch(e){}
})();
/* 扫码进入：URL 带 ?invite=CODE → 记住邀请码，注册页自动填入 */
let __urlInvite='';
(function(){
  try{ __urlInvite=(new URLSearchParams(location.search).get('invite')||'').toUpperCase(); }catch(e){}
  if(__urlInvite){
    setTimeout(()=>{
      if(state.user) return;
      state.view='register'; render();
    }, 400);
  }
})();
render();
