<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F7BFF"/>
      <stop offset=".55" stop-color="#3B5BEB"/>
      <stop offset="1" stop-color="#2E3ED9"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE6FF"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD86B"/>
      <stop offset="1" stop-color="#FFB13B"/>
    </linearGradient>
  </defs>

  <!-- 背景：圆角方形 + 顶部高光 -->
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <path d="M0 118C0 52.8 52.8 0 118 0h276c65.2 0 118 52.8 118 118v40C368 210 160 250 0 190V118z" fill="#FFFFFF" opacity=".10"/>

  <!-- 厂房主体（左右两跨，带锯齿屋顶） -->
  <path d="M76 402V232l110-62v62l110-62v270H76z" fill="url(#roof)" opacity=".96"/>
  <path d="M330 402V196l70-40 36 24v222H330z" fill="#FFFFFF" opacity=".42"/>

  <!-- 厂房门/窗 -->
  <rect x="112" y="300" width="46" height="102" rx="10" fill="#2E3ED9" opacity=".85"/>
  <rect x="186" y="316" width="46" height="86" rx="10" fill="#2E3ED9" opacity=".65"/>
  <circle cx="228" cy="252" r="13" fill="#2E3ED9" opacity=".55"/>
  <circle cx="282" cy="252" r="13" fill="#2E3ED9" opacity=".55"/>
  <rect x="352" y="238" width="30" height="44" rx="7" fill="#2E3ED9" opacity=".35"/>
  <rect x="394" y="238" width="30" height="44" rx="7" fill="#2E3ED9" opacity=".35"/>

  <!-- 金色齿轮（计件/生产） -->
  <g transform="translate(378,404)">
    <g fill="url(#gold)">
      <rect x="-9" y="-52" width="18" height="104" rx="8"/>
      <rect x="-52" y="-9" width="104" height="18" rx="8"/>
      <rect x="-9" y="-52" width="18" height="104" rx="8" transform="rotate(45)"/>
      <rect x="-52" y="-9" width="104" height="18" rx="8" transform="rotate(45)"/>
    </g>
    <circle r="34" fill="url(#gold)"/>
    <circle r="16" fill="#2E3ED9"/>
  </g>

  <!-- 底部进度条（报工进度） -->
  <rect x="88" y="436" width="240" height="16" rx="8" fill="#FFFFFF" opacity=".28"/>
  <rect x="88" y="436" width="164" height="16" rx="8" fill="url(#gold)"/>
</svg>